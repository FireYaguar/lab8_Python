[project]
name = "findex"
version = "1.0.0"
description = "findex — a small full-text search engine built step by step (university course)"
readme = "README.md"
authors = [{ name = "Student" }]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.2",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "numpy>=2.5.4",
    "pydantic-settings>=2.16.2",
    "rich>=15.0.0",
    "selectolax>=1.0.2",
    "typer>=0.28.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
findex = "findex.cli:app"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "hypothesis>=6.170.15",
    "matplotlib>=3.11.2",
    "py-spy>=0.4.3",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "pytest-benchmark>=5.3.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.4",
    "scalene>=2.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow' --benchmark-disable"
markers = ["slow: takes more than a second (run with: pytest -m slow, or -m '' for all)"]

[tool.coverage.run]
source = ["findex"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.12"

[tool.ruff]
line-length = 100
